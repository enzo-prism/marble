name: Release checks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: xcode-27
    # Step caps below sum to 288. The job cap must stay at or above that so a
    # hung gate dies at its own step instead of the job wall. Historical green
    # 43104061973 spent ~111 min before snapshots and ~198 min overall because
    # each of ~45 snapshot groups booted a simulator and started xcodebuild.
    # Batched snapshots on this branch are ~7-25 min (CI 44121214082: 6m31s
    # focused). Expected wall after batching is ~130-160 min; 300 min is that
    # budget plus headroom so a real dispatch can finish, including the
    # always-run upload (~10 min). Extra job slack so upload still runs if a
    # gate uses its full step cap.
    timeout-minutes: 300
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
      # `runner` is not a legal context in job-level env (run 44142395308).
      # RUNNER_TEMP is the process environment and is available in every step.
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
          echo "MIGRATION_DERIVED_DATA_ROOT=${RUNNER_TEMP}/marble-migration-builds" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 5
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 10
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 2
        run: scripts/release_evidence.sh init
      - name: Unit gate
        timeout-minutes: 25
        run: RELEASE_EVIDENCE_GATES=unit make release-evidence
      - name: Snapshot gate
        if: success() || failure()
        timeout-minutes: 45
        run: RELEASE_EVIDENCE_GATES=snapshot make release-evidence
      - name: UI gate
        if: success() || failure()
        timeout-minutes: 60
        run: RELEASE_EVIDENCE_GATES=ui make release-evidence
      - name: Accessibility gate
        if: success() || failure()
        timeout-minutes: 50
        run: RELEASE_EVIDENCE_GATES=accessibility make release-evidence
      - name: Migration gate
        if: success() || failure()
        timeout-minutes: 70
        run: RELEASE_EVIDENCE_GATES=migration make release-evidence
      - name: Finalize evidence manifest
        if: always()
        timeout-minutes: 5
        run: scripts/release_evidence.sh finalize
      - name: Preserve candidate evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
