name: Release checks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

# Parallel gate jobs, each with its own runner/simulator. Wall time is the
# longest job plus the always-run evidence assemble, not the sum.
#
# The 4h09m snapshot stall on main came from per-group simulator boots and
# xcodebuild startup across ~45 groups, not from the XCUITest tree walk.
# Dispatch 44145967148 on 7ac819a then showed sequential gates cascading:
# UI hit a 60 min step cap mid-KeyboardLayout (~16 suites still queued),
# which killed the simulator, and accessibility crashed in 1m24s.
#
# Caps are 44145967148 (and same-SHA CI migration 47m11s) plus ~25%
# headroom. No job is over 120 min. Each job cap is at or above the sum
# of its step caps, including the always-run 10 min upload, so a step
# timeout still uploads a fragment instead of cancelling the job wall.
#
# UI is three class shards because one UI job plus headroom would exceed
# 120 (JournalFlow 13 tests ~24 min; 60 min elapsed with ~16 suites still
# queued). Accessibility is a single 120 min job: `make audit` is the
# full AccessibilityAuditUITests class (History/Notes Default+XXXL with
# a 720s allowance, two runAuditSuite light/dark passes) plus AddSet and
# LogModePicker. CI 44142981959 spent ~15 min on just two of those tests.
#
#   unit 30          8m8s * 1.25 plus setup/upload; steps sum to 30
#   snapshot 40      15m8s * 1.25 plus setup/upload; steps sum to 40
#   ui-1/2/3 100     shard 1 is the 60 min A–Keyboard set * 1.25 plus
#                    setup/upload; steps sum to 93; 100 < 120
#   accessibility 120 full make audit; steps sum to 120
#   migration 80     CI 47m11s * 1.25 ≈ 59 plus setup/upload; ~75–80
#   evidence 25      assemble one five-gate manifest and upload it
#
# The evidence job `needs` every gate, runs `if: always()`, and uploads
# artifact `release-evidence` (the name App Store submit downloads).

jobs:
  unit:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Unit gate
        timeout-minutes: 12
        run: RELEASE_EVIDENCE_GATES=unit make release-evidence
      - name: Upload unit evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-unit
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  snapshot:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Snapshot gate
        timeout-minutes: 22
        run: RELEASE_EVIDENCE_GATES=snapshot make release-evidence
      - name: Upload snapshot evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-snapshot
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  ui:
    name: ui-${{ matrix.shard }}
    runs-on: xcode-27
    timeout-minutes: 100
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
      RELEASE_EVIDENCE_UI_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: UI shard
        timeout-minutes: 75
        run: RELEASE_EVIDENCE_GATES=ui make release-evidence
      - name: Upload UI shard evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-ui-${{ matrix.shard }}
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  accessibility:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Accessibility gate
        timeout-minutes: 102
        run: RELEASE_EVIDENCE_GATES=accessibility make release-evidence
      - name: Upload accessibility evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-accessibility
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  migration:
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
          echo "MIGRATION_DERIVED_DATA_ROOT=${RUNNER_TEMP}/marble-migration-builds" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Migration gate
        timeout-minutes: 61
        run: RELEASE_EVIDENCE_GATES=migration make release-evidence
      - name: Upload migration evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-migration
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [unit, snapshot, ui, accessibility, migration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
      - name: Download gate fragments
        if: always()
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/marble-release-fragments
          merge-multiple: false
          if-no-files-found: warn
      - name: Assemble five-gate manifest
        if: always()
        timeout-minutes: 3
        run: scripts/release_evidence.sh assemble "${RUNNER_TEMP}/marble-release-fragments"
      - name: Finalize evidence manifest
        if: always()
        timeout-minutes: 3
        run: scripts/release_evidence.sh finalize
      - name: Preserve candidate evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
