name: Release checks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: xcode-27
    # Previous greens spent ~202-208 min because snapshots rebooted the
    # simulator once per group (~44 boots). After batching those groups and
    # capping hung XCTest queries, a green run should finish in ~40-50 min.
    # 90 min is about 2x that budget so a hang dies before five hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select pinned Xcode
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        run: brew install xcbeautify || true
      - name: Run candidate checks
        timeout-minutes: 80
        env:
          RELEASE_EVIDENCE_ROOT: ${{ runner.temp }}/marble-release-evidence
          DERIVED_DATA_PATH: ${{ runner.temp }}/marble-derived-data
          MIGRATION_DERIVED_DATA_ROOT: ${{ runner.temp }}/marble-migration-builds
        run: make release-evidence
      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
