name: Release checks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

# Parallel gate jobs, each with its own runner/simulator. Wall time is the
# longest job plus the always-run evidence assemble, not the sum.
#
# The 4h09m snapshot stall on main came from per-group simulator boots and
# xcodebuild startup across ~45 groups, not from the XCUITest tree walk.
# Dispatch 44145967148 on 7ac819a then showed sequential gates cascading:
# UI hit a 60 min step cap mid-KeyboardLayout (~16 suites still queued),
# which killed the simulator, and accessibility crashed in 1m24s.
#
# Caps are dispatch 44185860768 on 1b5f098 plus ~25% headroom. No job is
# over 120 min. Each job cap is at or above the sum of its step caps,
# including the always-run 10 min upload, so a step timeout still
# uploads a fragment instead of cancelling the job wall.
#
# 44185860768 (wall 1h44m): unit gate killed at 12m still running tests;
# snapshot died on a 120s cold simctl bootstatus; ui-1 passed in 66m25s;
# accessibility finished the full suite in 44m (test failures, not a
# cap); ui-2/ui-3/migration failed tests under cap; evidence uploaded.
#
#   unit 40          12m timeout + remaining work; steps sum to 38
#   snapshot 40      15m8s from 44145967148 * 1.25; bootstatus 180s
#   ui-1/2/3 110     ui-1 66m25s * 1.25 = 83; gate 85; steps sum to 103
#   accessibility 80 full make audit in 44m * 1.25; steps sum to 78
#   migration 80     CI 47m11s * 1.25 plus setup/upload
#   evidence 25      assemble one five-gate manifest and upload it
#
# The evidence job `needs` every gate, runs `if: always()`, and uploads
# artifact `release-evidence` (the name App Store submit downloads).

jobs:
  unit:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Unit gate
        timeout-minutes: 20
        run: RELEASE_EVIDENCE_GATES=unit make release-evidence
      - name: Upload unit evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-unit
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  snapshot:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Snapshot gate
        timeout-minutes: 22
        run: RELEASE_EVIDENCE_GATES=snapshot make release-evidence
      - name: Upload snapshot evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-snapshot
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  ui:
    name: ui-${{ matrix.shard }}
    runs-on: xcode-27
    timeout-minutes: 110
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
      RELEASE_EVIDENCE_UI_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: UI shard
        timeout-minutes: 85
        run: RELEASE_EVIDENCE_GATES=ui make release-evidence
      - name: Upload UI shard evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-ui-${{ matrix.shard }}
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  accessibility:
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 2
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Accessibility gate
        timeout-minutes: 60
        run: RELEASE_EVIDENCE_GATES=accessibility make release-evidence
      - name: Upload accessibility evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-accessibility
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  migration:
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
          echo "MIGRATION_DERIVED_DATA_ROOT=${RUNNER_TEMP}/marble-migration-builds" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 2
        run: bash scripts/select_ci_xcode.sh
      - name: Start evidence run
        timeout-minutes: 1
        run: scripts/release_evidence.sh init
      - name: Migration gate
        timeout-minutes: 61
        run: RELEASE_EVIDENCE_GATES=migration make release-evidence
      - name: Upload migration evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-migration
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  evidence:
    needs: [unit, snapshot, ui, accessibility, migration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Export evidence paths
        timeout-minutes: 1
        run: echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
      - name: Download gate fragments
        if: always()
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/marble-release-fragments
          merge-multiple: false
          if-no-files-found: warn
      - name: Assemble five-gate manifest
        if: always()
        timeout-minutes: 3
        run: scripts/release_evidence.sh assemble "${RUNNER_TEMP}/marble-release-fragments"
      - name: Finalize evidence manifest
        if: always()
        timeout-minutes: 3
        run: scripts/release_evidence.sh finalize
      - name: Preserve candidate evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
