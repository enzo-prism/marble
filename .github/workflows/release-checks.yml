name: Release checks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: xcode-27
    # Step caps below sum to 398. The job cap must stay at or above that so a
    # hung gate dies at its own step instead of the job wall. Dispatch
    # 44145967148 on 7ac819a (job 2h37m; wall 3h21m including queue):
    # unit 8m8s, snapshot 15m8s, UI killed at 60m13s mid-KeyboardLayout with
    # ~16 suites left, a11y 1m24s crashed after the UI timeout killed the
    # simulator, migration killed at 70m13s on the 3rd of 3 baselines.
    # Same-SHA CI migration finished in 47m11s. Historical green 43104061973
    # was 198 min overall (per-group snapshots). Caps below add ~10-30 min
    # headroom on observed/estimated gate times so a real dispatch can finish,
    # including the always-run upload (~10 min). Extra job slack so upload
    # still runs if a gate uses its full step cap.
    timeout-minutes: 410
    env:
      RELEASE_EVIDENCE_DEFER_MANIFEST: "1"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
      # `runner` is not a legal context in job-level env (run 44142395308).
      # RUNNER_TEMP is the process environment and is available in every step.
      - name: Export evidence paths
        timeout-minutes: 1
        run: |
          echo "RELEASE_EVIDENCE_ROOT=${RUNNER_TEMP}/marble-release-evidence" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/marble-derived-data" >> "$GITHUB_ENV"
          echo "MIGRATION_DERIVED_DATA_ROOT=${RUNNER_TEMP}/marble-migration-builds" >> "$GITHUB_ENV"
      - name: Select pinned Xcode
        timeout-minutes: 5
        run: bash scripts/select_ci_xcode.sh
      - name: Install test log formatter
        timeout-minutes: 10
        run: brew install xcbeautify || true
      - name: Start evidence run
        timeout-minutes: 2
        run: scripts/release_evidence.sh init
      - name: Unit gate
        timeout-minutes: 25
        run: RELEASE_EVIDENCE_GATES=unit make release-evidence
      - name: Snapshot gate
        if: success() || failure()
        timeout-minutes: 45
        run: RELEASE_EVIDENCE_GATES=snapshot make release-evidence
      - name: UI gate
        if: success() || failure()
        timeout-minutes: 140
        run: RELEASE_EVIDENCE_GATES=ui make release-evidence
      - name: Accessibility gate
        if: success() || failure()
        timeout-minutes: 50
        run: RELEASE_EVIDENCE_GATES=accessibility make release-evidence
      - name: Migration gate
        if: success() || failure()
        timeout-minutes: 100
        run: RELEASE_EVIDENCE_GATES=migration make release-evidence
      - name: Finalize evidence manifest
        if: always()
        timeout-minutes: 5
        run: scripts/release_evidence.sh finalize
      - name: Preserve candidate evidence
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: ${{ runner.temp }}/marble-release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
