name: TestFlight

# Archive, sign, and upload Marble to TestFlight from a GitHub-hosted
# macOS 26 runner. Linux Cloud Agents cannot xcodebuild; they dispatch this
# workflow or push a publish/testflight/* tag (see CLOUD_RELEASE.md).
#
# Does not run on ordinary pushes. Manual / agent-triggered only.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload (required)'
        required: true
        type: string
      dry_run:
        description: 'Archive and export but do not upload'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "publish/testflight"
      - "publish/testflight/**"

concurrency:
  group: marble-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  ASC_APP: "6757725234"
  ASC_APP_ID: "6757725234"
  ASC_BYPASS_KEYCHAIN: "true"
  ASC_DEFAULT_OUTPUT: json
  ASC_UPLOAD_TIMEOUT: 45m

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      APPLE_DISTRIBUTION_P12_B64: ${{ secrets.APPLE_DISTRIBUTION_P12_B64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      MOBILEPROVISION_APP_B64: ${{ secrets.MOBILEPROVISION_APP_B64 }}
      MOBILEPROVISION_WIDGET_B64: ${{ secrets.MOBILEPROVISION_WIDGET_B64 }}
    steps:
      - name: Confirm intent
        env:
          CONFIRM: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm || 'publish' }}
        run: |
          if [[ "$CONFIRM" != "publish" ]]; then
            echo "Refusing to archive: workflow_dispatch confirm must be exactly 'publish'"
            exit 1
          fi

      - name: Check required secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64 APPLE_DISTRIBUTION_P12_B64 APPLE_DISTRIBUTION_P12_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "MISSING secret: $name"
              missing=1
            else
              echo "present: $name"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::GitHub Actions secrets are incomplete. Run scripts/bootstrap_github_release_secrets.sh on the Mac that already archives Marble. See CLOUD_RELEASE.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: bash scripts/select_ci_xcode.sh

      - name: Setup App Store Connect CLI
        uses: rudrankriyam/setup-asc@v1
        with:
          version: "4.11.0"

      - name: Import signing identity and profiles
        run: scripts/ci_import_signing.sh

      - name: Publish to TestFlight
        env:
          ASC_EXPORT_OPTIONS: ${{ github.workspace }}/.asc/ExportOptions.plist
        run: |
          extra=()
          if [[ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}" == "true" ]]; then
            extra+=(--dry-run)
          fi
          scripts/ci_testflight.sh "${extra[@]}"

      - name: Preserve immutable upload receipt
        if: success() && inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: upload-receipt
          path: .asc/artifacts/upload-receipts/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
