name: Verify History date audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: bash scripts/select_ci_xcode.sh
      - name: Install test formatter
        run: brew install xcbeautify || true
      - name: Verify twice on fresh iPhone Air
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            simulator_id=$(xcrun simctl create "History audit $attempt" com.apple.CoreSimulator.SimDeviceType.iPhone-Air com.apple.CoreSimulator.SimRuntime.iOS-26-5)
            xcrun simctl boot "$simulator_id"
            xcrun simctl bootstatus "$simulator_id" -b
            MARBLE_SIMULATOR_ID="$simulator_id" RESULT_BUNDLE_PATH="$PWD/TestResults/HistoryAudit-$attempt.xcresult" make only TEST=MarbleUITests/AccessibilityAuditUITests/testHistoryAndRecoveryAccessibilityAudit_DefaultText
            xcrun simctl shutdown "$simulator_id"
            xcrun simctl delete "$simulator_id"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-audit-check
          path: TestResults/*.xcresult
          if-no-files-found: error
