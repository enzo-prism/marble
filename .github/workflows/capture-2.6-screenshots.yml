name: Capture Marble 2.6 screenshots
on:
  push:
    branches: [automation/screenshots-2.6-83]
    paths: [.github/workflows/capture-2.6-screenshots.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d46a09815776b0a35d68326b22772487a4cfe0f
      - name: Select candidate toolchain
        run: bash scripts/select_ci_xcode.sh
      - name: Capture real iPhone and iPad interfaces
        shell: bash
        run: |
          set -euo pipefail
          export DERIVED_DATA_PATH="$RUNNER_TEMP/screenshots-derived"
          mkdir -p captures
          for device in iphone ipad; do
            if [[ "$device" == iphone ]]; then
              type=com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max
            else
              type=com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-16GB
            fi
            if [[ "$device" == ipad ]]; then
              type=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next(x["identifier"] for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPad Pro 13-inch (M5)")))')
            fi
            udid=$(xcrun simctl create "Marble83-$device" "$type" com.apple.CoreSimulator.SimRuntime.iOS-26-5)
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
            mkdir -p "captures/$device"
            MARBLE_SIMULATOR_ID="$udid" RESULT_BUNDLE_PATH="$PWD/captures/$device/captures.xcresult" scripts/xcodebuild_test.sh \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test00AddComposer \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test01Journal \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test02PasteOrTypeReview \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test05StrengthTrends \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test07TrainingCalendar \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test09PrivateBackup \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test11DailyHighlights \
              -only-testing:MarbleUITests/AppStoreScreenshotUITests/test12HistoryAndRepeat
            xcrun xcresulttool export attachments --path "captures/$device/captures.xcresult" --output-path "captures/$device/attachments"
            xcrun simctl shutdown "$udid"
          done
      - name: Prepare caption canvases and provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('captures')
          m=json.load(open('AppStore/screenshots/2.5/manifest.json'))
          for k in ['binarySourceCommit','submissionBuild','sourceNote','capturedBuild','submissionSourceCommit']:m.pop(k,None)
          m.update(version='2.6',build='83',sourceCommit='8d46a09815776b0a35d68326b22772487a4cfe0f')
          m['fixture']['now']='2026-07-15 21:30 simulator local time'
          json.dump(m,open(root/'manifest.json','w'),indent=2)
          for device in ['iphone','ipad']:
            dest=root/device/'raw';dest.mkdir()
            attachments=json.load(open(root/device/'attachments/manifest.json'))
            for story in m['screenshots']:
              matches=[a for t in attachments for a in t['attachments'] if a['suggestedHumanReadableName'].startswith(story['rawName']+'_') and a['exportedFileName'].endswith('.png')]
              assert len(matches)==1,(device,story['rawName'],matches)
              shutil.copy2(root/device/'attachments'/matches[0]['exportedFileName'],dest/(story['rawName']+'.png'))
          PY
          for device in iphone ipad; do
            swift scripts/compose_app_store_screenshots.swift captures/manifest.json "captures/$device/raw" "captures/$device/composed"
          done
          python3 - <<'PY'
          import pathlib,json,shutil,hashlib
          root=pathlib.Path('captures');m=json.load(open(root/'manifest.json')); checks={}
          for device in ['iphone','ipad']:
            out=root/device/'upload';out.mkdir()
            for story in m['screenshots']:
              p=out/f"{story['order']:02d}-{story['rawName']}.png"
              shutil.copy2(root/device/'composed'/(story['rawName']+'.png'),p)
              checks[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          json.dump(checks,open(root/'checksums.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-2.6-83-screenshots
          path: captures
          retention-days: 14
          if-no-files-found: error
