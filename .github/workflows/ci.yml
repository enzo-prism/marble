name: CI

# Runs unit tests, import/history interactions, focused snapshots, and workout
# review/History/recovery accessibility on every PR and release-line push. Full snapshots, UI, accessibility, and
# migration checks run separately in the pinned Release checks workflow.
#
# TestFlight / App Store uploads are NOT this workflow. See
# .github/workflows/release-testflight.yml, release-appstore.yml, and CLOUD_RELEASE.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # The app targets the iOS 26 SDK, so this needs a runner image with Xcode 26.x and
    # the matching iOS 26 simulator runtime. Switch to a self-hosted runner if the
    # GitHub-hosted macOS 26 image is not yet available to this org.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select pinned Xcode
        run: bash scripts/select_ci_xcode.sh

      - name: List available simulator runtimes
        run: xcrun simctl list runtimes

      - name: Install xcbeautify (prettier logs)
        run: brew install xcbeautify || true

      - name: Run unit tests
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/Unit.xcresult" make unit

      - name: Audit workout review, history and recovery
        if: success() || failure()
        run: |
          RESULT_BUNDLE_PATH="$PWD/TestResults/HistoryAccessibility.xcresult" scripts/xcodebuild_test.sh \
            -only-testing:MarbleUITests/AccessibilityAuditUITests/testHistoryAndRecoveryAccessibilityAudit_DefaultText \
            -only-testing:MarbleUITests/AccessibilityAuditUITests/testWorkoutNotesReviewAccessibility_DefaultText

      - name: Verify History and import interactions
        if: success() || failure()
        run: |
          RESULT_BUNDLE_PATH="$PWD/TestResults/HistoryLargestText.xcresult" scripts/xcodebuild_test.sh \
            -only-testing:MarbleUITests/WorkoutHistoryUITests \
            -only-testing:MarbleUITests/DraftResumeUITests/testLargestTextDateAndTimeControlsRemainReachable \
            -only-testing:MarbleUITests/ImportFlowUITests/testAddTabReviewsBeforeSavingStructuredSets \
            -only-testing:MarbleUITests/ImportFlowUITests/testAppleNotesBoundsAndSprintsSaveAllEightSets \
            -only-testing:MarbleUITests/ImportFlowUITests/testRemovingEarlierUnorganizedLinePreservesAnotherPendingEdit

      - name: Verify History and Composer snapshots
        if: success() || failure()
        run: SNAPSHOT_GROUPS_OVERRIDE=MarbleSnapshotTests/WorkoutHistorySnapshotTests,MarbleSnapshotTests/WorkoutComposerSnapshotTests make snapshot

      - name: Verify release tooling
        if: success() || failure()
        run: |
          ruby scripts/tests/release_candidate_test.rb
          ruby scripts/tests/migration_probe_test.rb

      - name: Verify shipped-store migration
        if: success() || failure()
        run: |
          destination=$(scripts/sim_destination.sh)
          simulator_id=${destination#id=}
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$simulator_id" -b
          SIMULATOR_UDID="$simulator_id" make migration-release

      - name: Run navigation smoke tests
        if: success() || failure()
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/Smoke.xcresult" make ui-smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.xcresult
          if-no-files-found: ignore
