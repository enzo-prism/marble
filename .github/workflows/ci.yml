name: CI

# Runs unit tests, navigation smoke tests, and the History/recovery accessibility
# audit on every PR and release-line push. Full snapshots, UI, accessibility, and
# migration checks run separately in the pinned Release checks workflow.
#
# TestFlight / App Store uploads are NOT this workflow. See
# .github/workflows/release-testflight.yml, release-appstore.yml, and CLOUD_RELEASE.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # The app targets the iOS 26 SDK, so this needs a runner image with Xcode 26.x and
    # the matching iOS 26 simulator runtime. Switch to a self-hosted runner if the
    # GitHub-hosted macOS 26 image is not yet available to this org.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: bash scripts/select_ci_xcode.sh

      - name: List available simulator runtimes
        run: xcrun simctl list runtimes

      - name: Install xcbeautify (prettier logs)
        run: brew install xcbeautify || true

      - name: Audit workout history and recovery
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/HistoryAccessibility.xcresult" make only TEST=MarbleUITests/AccessibilityAuditUITests/testHistoryAndRecoveryAccessibilityAudit_DefaultText

      - name: Verify History and import interactions
        if: success() || failure()
        run: |
          RESULT_BUNDLE_PATH="$PWD/TestResults/HistoryLargestText.xcresult" scripts/xcodebuild_test.sh \
            -only-testing:MarbleUITests/WorkoutHistoryUITests \
            -only-testing:MarbleUITests/ImportFlowUITests/testAddTabReviewsBeforeSavingStructuredSets

      # Temporary baseline capture for the intentional accessible date/time layout.
      # Remove after visual review; final CI must compare committed references.
      - name: Record accessible Composer timing layout
        run: SNAPSHOT_GROUPS_OVERRIDE=MarbleSnapshotTests/WorkoutComposerSnapshotTests/testWorkoutComposerReview,MarbleSnapshotTests/WorkoutComposerSnapshotTests/testWorkoutComposerCorrectedWeightAfterRecovery make snapshot-record

      - name: Preserve Composer baseline candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-baseline-candidates
          path: Tests/Snapshots/__Snapshots__/WorkoutComposerSnapshotTests
          if-no-files-found: error

      - name: Verify History and Composer snapshots
        run: SNAPSHOT_GROUPS_OVERRIDE=MarbleSnapshotTests/WorkoutHistorySnapshotTests,MarbleSnapshotTests/WorkoutComposerSnapshotTests make snapshot

      - name: Run unit tests
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/Unit.xcresult" make unit

      - name: Verify release tooling
        run: |
          ruby scripts/tests/release_candidate_test.rb
          ruby scripts/tests/migration_probe_test.rb

      - name: Verify shipped-store migration
        run: make migration-release

      - name: Run navigation smoke tests
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/Smoke.xcresult" make ui-smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.xcresult
          if-no-files-found: ignore
