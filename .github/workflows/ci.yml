name: CI

# Runs unit tests, navigation smoke tests, and the History/recovery accessibility
# audit on every PR and release-line push. Full snapshots, UI, accessibility, and
# migration checks run separately in the pinned Release checks workflow.
#
# TestFlight / App Store uploads are NOT this workflow. See
# .github/workflows/release-testflight.yml, release-appstore.yml, and CLOUD_RELEASE.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # The app targets the iOS 26 SDK, so this needs a runner image with Xcode 26.x and
    # the matching iOS 26 simulator runtime. Switch to a self-hosted runner if the
    # GitHub-hosted macOS 26 image is not yet available to this org.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: bash scripts/select_ci_xcode.sh

      - name: List available simulator runtimes
        run: xcrun simctl list runtimes

      - name: Install xcbeautify (prettier logs)
        run: brew install xcbeautify || true

      - name: Audit workout history and recovery
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/HistoryAccessibility.xcresult" make only TEST=MarbleUITests/AccessibilityAuditUITests/testHistoryAndRecoveryAccessibilityAudit_DefaultText

      - name: Verify Repeat Workout at largest text
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/HistoryLargestText.xcresult" make only TEST=MarbleUITests/WorkoutHistoryUITests/testRepeatWorkoutSupportsLargestAccessibilityText

      - name: Run unit tests
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/Unit.xcresult" make unit

      - name: Verify release tooling
        run: |
          ruby scripts/tests/release_candidate_test.rb
          ruby scripts/tests/migration_probe_test.rb

      - name: Run navigation smoke tests
        run: RESULT_BUNDLE_PATH="$PWD/TestResults/Smoke.xcresult" make ui-smoke

      # One-time baseline refresh for the intentional build-65 contrast/wrapping
      # correction. Remove this step after reviewing and committing the images.
      - name: Record corrected History snapshots
        run: |
          SNAPSHOT_GROUPS_OVERRIDE=MarbleSnapshotTests/WorkoutHistorySnapshotTests make snapshot-record

      - name: Preserve corrected History snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-history-snapshots
          path: Tests/Snapshots/__Snapshots__/WorkoutHistorySnapshotTests/*.png
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.xcresult
          if-no-files-found: ignore
